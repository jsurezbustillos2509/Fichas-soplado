<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Fichas de Proceso Soplado</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#101316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOPLADO">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Librerías externas ligeras (evitan inflar tu código) -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="stripe"></div>
    <div class="wrap barin">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Logo Soplado" width="46" height="46">
        <div class="brand-txt">
          <b>Fichas de proceso</b>
          <span>Soplado PEAD · parámetros estándar</span>
        </div>
      </div>
      <button class="btn ghost" id="theme" type="button" aria-label="Cambiar tema de color">Tema: Auto</button>
    </div>
  </header>

  <main class="wrap" id="app">
    <div class="empty">Cargando catálogo desde la base de datos...</div>
  </main>

  <div class="toast" id="toast" hidden role="status"></div>
  <div id="ovbox"></div>

  <!-- type="module" permite dividir el JS en archivos pequeños en GitHub Pages -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
