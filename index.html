<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichas de Proceso Soplado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
/* Concepto: placa de máquina. Franja de precaución, placas oscuras con lecturas tipo HMI, valores en monoespaciada. */
:root{
  --bg:#D3D8DC; --panel:#F3F5F6; --panel-2:#E4E8EB; --ink:#14181B; --steel:#4C5862; --line:#B2BBC2; --edge:#14181B;
  --yellow:#FFC400; --on-yellow:#14181B; --ok:#1B7F3B; --on-ok:#FFFFFF; --alert:#C62828; --on-alert:#FFFFFF; --hi:#FFE08A;
  --plate-bg:#101316; --plate-fg:#F2F4F5; --plate-mute:#9AA6B0; --lcd-bg:#07090A; --lcd-edge:#2A3238;
  --photo-bg:#FFFFFF; --qr-fg:#000000; --qr-bg:#FFFFFF;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1113; --panel:#1A1F23; --panel-2:#242A2F; --ink:#E9ECEE; --steel:#9AA6B0; --line:#363F47; --edge:#5B6771;
    --ok:#4CC26F; --on-ok:#0E1113; --alert:#FF6B63; --on-alert:#0E1113; --hi:#5A4A12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1113; --panel:#1A1F23; --panel-2:#242A2F; --ink:#E9ECEE; --steel:#9AA6B0; --line:#363F47; --edge:#5B6771;
  --ok:#4CC26F; --on-ok:#0E1113; --alert:#FF6B63; --on-alert:#0E1113; --hi:#5A4A12; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;margin:0;padding-block:0 48px;min-height:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#14181B 14px 28px)}
.topbar{background:var(--plate-bg);color:var(--plate-fg)}
.barin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.brand span{font-family:var(--font-data);font-size:13px;color:var(--plate-mute)}
.btn{min-height:44px;padding:8px 16px;border:2px solid var(--edge);background:var(--panel);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border-radius:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--yellow);color:var(--on-yellow);border-color:var(--on-yellow)}
.btn.solid{background:var(--yellow);color:var(--on-yellow);border-color:var(--on-yellow)}
.btn.solid:hover{background:var(--panel);color:var(--ink);border-color:var(--edge)}
.btn.ghost{background:transparent;color:var(--plate-fg);border-color:var(--plate-mute);min-height:40px;font-size:15px;padding:6px 12px}
.btn.ghost:hover{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.btn:disabled{opacity:.6;cursor:wait}

main{padding-top:24px}
h1,h2{margin:0}
.page-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vw,40px);text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.count{font-family:var(--font-data);font-size:14px;color:var(--steel)}
.lead{margin:0 0 18px;color:var(--steel);max-width:62ch}

/* filtros */
.filters{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) auto;gap:12px;align-items:end;margin-bottom:20px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.field select,.field input{min-height:46px;padding:8px 12px;border:2px solid var(--edge);background:var(--panel);border-radius:0;width:100%}

/* tarjetas del catálogo */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);background:var(--panel);border:2px solid var(--edge);text-decoration:none;color:inherit;cursor:pointer}
.card:hover{border-color:var(--yellow);box-shadow:0 0 0 3px var(--yellow)}
.card .ph{background:var(--photo-bg);display:grid;place-items:center;padding:10px;border-right:2px solid var(--edge)}
.card .ph img{max-height:150px;width:auto;max-width:100%}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .sku{font-family:var(--font-data);font-weight:600;font-size:20px}
.card .desc{font-family:var(--font-display);font-weight:600;font-size:20px;text-transform:uppercase;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-data);font-size:13px;font-weight:600;padding:2px 8px;background:var(--yellow);color:var(--on-yellow)}
.chip.out{background:transparent;color:var(--ink);border:1px solid var(--edge)}
.card .mini{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:auto;font-family:var(--font-data);font-size:14px;color:var(--steel)}
.card .mini b{color:var(--ink);font-size:18px}
.empty{padding:28px;border:2px dashed var(--steel);color:var(--steel);text-align:center;grid-column:1 / -1}

/* ficha */
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.nav .sp{flex:1}
.sheet{background:var(--panel);border:2px solid var(--edge)}
.plate{background:var(--plate-bg);color:var(--plate-fg);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"foto info lcd";gap:20px;align-items:stretch}
.foto{grid-area:foto;background:var(--photo-bg);padding:8px;display:grid;place-items:center;width:112px}
.foto img{max-height:210px;width:auto;max-width:100%}
.info{grid-area:info;display:flex;flex-direction:column;gap:8px;min-width:0;justify-content:center}
.kicker{font-family:var(--font-data);font-size:13px;color:var(--plate-mute);letter-spacing:.06em;text-transform:uppercase}
.sku-big{font-family:var(--font-data);font-weight:600;font-size:clamp(30px,7vw,46px);color:var(--yellow);line-height:1.05;word-break:break-word}
.desc-big{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4.6vw,32px);text-transform:uppercase;line-height:1.08;text-wrap:balance}
.lcd{grid-area:lcd;background:var(--lcd-bg);border:3px solid var(--lcd-edge);padding:10px 18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:170px}
.lcd small{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--plate-mute);text-transform:uppercase}
.lcd .dig{font-family:var(--font-data);font-weight:600;font-size:clamp(64px,14vw,92px);line-height:1;color:var(--yellow);text-shadow:0 0 14px rgba(255,196,0,.35);font-variant-numeric:tabular-nums}
.lcd .u{font-family:var(--font-data);font-size:14px;color:var(--plate-mute)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:2px solid var(--edge)}
.stat{padding:12px 14px;border-right:1px solid var(--line);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .n{font-family:var(--font-data);font-weight:600;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .n.zero{color:var(--steel);font-weight:500}
.stat .l{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.stat .h{font-size:14px;color:var(--steel)}

.sec{padding:0 18px 20px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;background:var(--plate-bg);color:var(--plate-fg);padding:8px 12px;margin:22px 0 14px}
.sec-h .tag{background:var(--yellow);color:var(--on-yellow);font-family:var(--font-data);font-weight:600;font-size:14px;padding:2px 8px;letter-spacing:.04em}
.sec-h h2{font-family:var(--font-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.sec-h .sub{font-size:14px;color:var(--plate-mute);margin-left:auto}
.flag{display:inline-block;background:var(--yellow);color:var(--on-yellow);font-family:var(--font-data);font-weight:600;font-size:12px;padding:1px 6px;margin-right:6px;letter-spacing:.03em}
.note{font-size:14px;color:var(--steel);margin:10px 0 0;max-width:80ch}

/* barras a escala */
.axis,.brow{display:grid;grid-template-columns:132px minmax(0,1fr) 84px;gap:10px;align-items:center}
.axis{margin-bottom:4px}
.ticks{position:relative;height:16px;font-family:var(--font-data);font-size:12px;color:var(--steel)}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.bars{display:grid;gap:5px}
.brow .lb{font-family:var(--font-display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.track{position:relative;height:28px;background-color:var(--panel-2)}
.track.two{height:32px}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--yellow);border-right:3px solid var(--edge)}
.fill.l{top:3px;bottom:auto;height:12px}
.fill.d{top:17px;bottom:auto;height:12px;background:var(--steel);border-right-color:var(--ink)}
.brow .vl{font-family:var(--font-data);font-weight:600;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.brow .vl small{display:block;font-weight:500;font-size:12px;color:var(--steel)}
.brow .vl2{font-family:var(--font-data);font-weight:600;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.25;display:flex;flex-direction:column;align-items:flex-end}
.brow .vl2 span{padding:0 4px}
.brow .vl2 span.df{background:var(--hi)}
.brow .vl2 i{font-style:normal;font-weight:500;color:var(--steel);margin-right:4px}
.brow.zero .lb,.brow.zero .vl{color:var(--steel)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--steel);margin-top:8px}
.key b{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:middle}

/* tablas de parámetros */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 28px}
.ptab{min-width:0}
.phead,.prow{display:grid;grid-template-columns:minmax(0,1fr) 68px 68px;align-items:center}
.phead{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--steel);text-align:center;padding-bottom:2px}
.prow{border-bottom:1px solid var(--line);min-height:44px}
.prow .nm{padding:6px 8px 6px 0;font-weight:500;line-height:1.2}
.v{font-family:var(--font-data);font-weight:600;font-size:19px;text-align:center;background:var(--panel-2);margin:4px 3px;padding:4px 0;font-variant-numeric:tabular-nums}
.v.zero{color:var(--steel);font-weight:500}
.v.one{grid-column:2 / 4}

.pq2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.pqb{border:1px solid var(--edge);padding:8px 10px;min-width:0}
.pqb h3{margin:0 0 6px;font-family:var(--font-data);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pqg{display:grid;grid-template-columns:20px repeat(3,minmax(0,1fr));gap:3px;align-items:center;text-align:center}
.pqg .h{font-family:var(--font-data);font-size:12px;color:var(--steel)}
.pqg .r{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--steel)}
.pqg .v{margin:0;font-size:18px}

.vfd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.vf{border:1px solid var(--edge);padding:10px 12px;min-width:0}
.vf .l{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.vf .n{font-family:var(--font-data);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums}
.vf .n small{font-size:15px;font-weight:500;color:var(--steel)}
.vf .n.zero{color:var(--steel);font-weight:500}
.vf .za2{font-family:var(--font-data);font-size:13px;color:var(--steel)}
.vf.pend{border:2px dashed var(--steel)}
.vf.pend .n{font-size:15px;font-weight:500;color:var(--steel);font-family:var(--font-data)}

.tools{display:grid;grid-template-columns:minmax(88px,auto) repeat(3,minmax(0,1fr));gap:8px;align-items:center;max-width:720px}
.tools .hh{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.tools .mo{font-family:var(--font-data);font-weight:600}
.blank{min-height:46px;border:2px dashed var(--steel);display:grid;place-items:center;font-family:var(--font-data);font-size:13px;color:var(--steel);padding:2px 6px;text-align:center}
.blank.filled{border-style:solid;border-color:var(--edge);color:var(--ink);font-weight:600;font-size:18px}

/* calefacción BEKUM */
.zones{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.zt{border:1px solid var(--edge);padding:8px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.zt.off{background:var(--panel-2)}
.zt .zn{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.pill{display:inline-block;font-family:var(--font-data);font-weight:600;font-size:13px;padding:1px 10px;letter-spacing:.04em}
.pill.ok{background:var(--ok);color:var(--on-ok)}
.pill.bad{background:var(--alert);color:var(--on-alert)}
.zt .zc{font-family:var(--font-data);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.1}
.zt.off .zc{color:var(--steel);font-weight:500}
.zt .zl{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.1em;color:var(--steel)}
.zt .za{font-family:var(--font-data);font-size:12px;color:var(--steel);line-height:1.2}
.sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.sw{border:1px solid var(--edge);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sw .l{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}

.foot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;border-top:2px solid var(--edge);padding:18px}
.qr{background:var(--qr-bg);padding:6px;border:2px solid var(--edge);width:176px;height:176px}
.qr svg{display:block;width:100%;height:100%}
.foot h2{font-family:var(--font-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05;margin-bottom:6px}
.foot code{display:block;font-family:var(--font-data);font-size:13px;word-break:break-all;background:var(--panel-2);padding:6px 8px;margin:6px 0;user-select:all}
.foot .meta{font-size:14px;color:var(--steel)}
.legend{padding:0 18px 16px;font-size:14px;color:var(--steel)}
.legend p{margin:0 0 4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--plate-bg);color:var(--plate-fg);border:2px solid var(--yellow);padding:10px 16px;font-family:var(--font-display);font-weight:600;font-size:18px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ovin{max-width:560px;margin:0 auto;background:var(--panel);border:2px solid var(--yellow);padding:14px;display:flex;flex-direction:column;gap:12px}
.ovin p{margin:0;font-weight:500}
.ovin img{width:100%;height:auto;display:block;background:#fff}
.ovb{display:flex;flex-wrap:wrap;gap:10px}

@media (max-width:760px){
  .zones{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .filters{grid-template-columns:minmax(0,1fr)}
  .plate{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"foto info" "lcd lcd";gap:14px}
  .foto{width:92px}
  .lcd{flex-direction:row;gap:12px;justify-content:space-between;align-items:baseline;min-width:0}
  .foot{grid-template-columns:minmax(0,1fr);justify-items:start}
  .sec{padding:0 14px 18px}
  .sec-h .sub{margin-left:0;flex-basis:100%}
  .axis,.brow{grid-template-columns:96px minmax(0,1fr) 70px;gap:8px}
  .brow .lb{font-size:16px}
  .ticks span:nth-child(even){display:none}
}
@media (max-width:360px){ .pq2{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="stripe"></div>
  <div class="wrap barin">
    <div class="brand"><b>Fichas de proceso</b><span>Soplado PEAD · parámetros estándar</span></div>
    <button class="btn ghost" id="theme" type="button" aria-label="Cambiar tema de color">Tema: Auto</button>
  </div>
</header>
<main class="wrap" id="app"><div class="empty">Cargando catálogo desde la base de datos...</div></main>
<div class="toast" id="toast" hidden role="status"></div>
<div id="ovbox"></div>

<script>
/* Codificador QR: QRCode for JavaScript, (c) 2009 Kazuhiko Arase, licencia MIT */

__m["QRMode"]=function(module,exports,require){
module.exports = { MODE_NUMBER:1<<0, MODE_ALPHA_NUM:1<<1, MODE_8BIT_BYTE:1<<2, MODE_KANJI:1<<3 };
};
__m["QRMaskPattern"]=function(module,exports,require){
module.exports = { PATTERN000:0, PATTERN001:1, PATTERN010:2, PATTERN011:3, PATTERN100:4, PATTERN101:5, PATTERN110:6, PATTERN111:7 };
};
__m["QRErrorCorrectLevel"]=function(module,exports,require){
module.exports = { L:1, M:0, Q:3, H:2 };
};

  EXP_TABLE:new Array(256), LOG_TABLE:new Array(256)
};
for(var i=0;i<8;i++) QRMath.EXP_TABLE[i]=1<<i;
for(var i=8;i<256;i++) QRMath.EXP_TABLE[i]=QRMath.EXP_TABLE[i-4]^QRMath.EXP_TABLE[i-5]^QRMath.EXP_TABLE[i-6]^QRMath.EXP_TABLE[i-8];

module.exports = QRMath;
};
__m["QRPolynomial"]=function(module,exports,require){
var QRMath = require('./QRMath');
function QRPolynomial(num, shift){
  if(num.length===undefined) throw new Error(num.length+"/"+shift);
  var offset=0; while(offset<num.length && num[offset]===0) offset++;
  this.num=new Array(num.length-offset+shift);
  for(var i=0;i<num.length-offset;i++) this.num[i]=num[i+offset];
}
QRPolynomial.prototype = {
  get:function(index){ return this.num[index]; },
  getLength:function(){ return this.num.length; },
  multiply:function(e){
    var num=new Array(this.getLength()+e.getLength()-1);
    for(var i=0;i<this.getLength();i++) for(var j=0;j<e.getLength();j++) num[i+j]^=QRMath.gexp(QRMath.glog(this.get(i))+QRMath.glog(e.get(j)));
    return new QRPolynomial(num,0);

let FICHAS = [];

const toNum = (v, def = 0) => {
  if (v === null || v === undefined || String(v).trim() === '') return def;
  const parsed = Number(String(v).trim().replace(',', '.'));
  return Number.isFinite(parsed) ? parsed : def;
};
const numOrNull = (v) => {
  if (v === null || v === undefined || String(v).trim() === '') return null;
  const parsed = Number(String(v).trim().replace(',', '.'));
  return Number.isFinite(parsed) ? parsed : null;
};
const strOrNull = (v) => {
  if (v === null || v === undefined || String(v).trim() === '') return null;
  return String(v).trim();
};
const toBool = (v) => String(v || '').trim().toUpperCase() === 'TRUE';

function fetchCsv(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: res => resolve(res.data || []),
      error: err => reject(err)
    });
  });
}

function buildFicha(r, qMap, bMap) {

  const layout = String(r.layout || 'qcm').trim().toLowerCase();

    id,
    layout,
    sku: String(r.sku || '').trim(),
    desc: String(r.desc || '').trim(),
    maquina: String(r.maquina || '').trim(),
    hmi: String(r.hmi || '').trim(),
    ciclo: toNum(r.ciclo, 1),
    cicloTipo: String(r.cicloTipo || 'Ciclo real').trim(),
    moldes: toNum(r.moldes, 0),
    cavidades: toNum(r.cavidades, 0),
    pesoG: toNum(r.pesoG, 0),
    bolsas: toNum(r.bolsas, 0),
    bolsasPeriodo: strOrNull(r.bolsasPeriodo),
    foto: String(r.foto || '').trim(),
    fecha: String(r.fecha || '').trim(),
    version: String(r.version || '1.0').trim(),
    unidad: {
      factor: toNum(r.unidad_factor, 0.1),
      confirmada: toBool(r.unidad_confirmada)
    },
    leyenda: r.leyenda ? String(r.leyenda).split('|').map(t => t.trim()).filter(Boolean) : []
  };

  if (layout === 'bekum') {
    const b = bMap.get(id) || {};
    base.encabezado = [toNum(b.encabezado_izq), toNum(b.encabezado_der)];
    base.tiempos = [
      ["Ret. Subir Brazo", toNum(b.tiempos_Ret_Subir_Brazo_L), toNum(b.tiempos_Ret_Subir_Brazo_R)],
      ["Ret. Bajar Brazo", toNum(b.tiempos_Ret_Bajar_Brazo_L), toNum(b.tiempos_Ret_Bajar_Brazo_R)],
      ["Ret. Corte Manga", toNum(b.tiempos_Ret_Corte_Manga_L), toNum(b.tiempos_Ret_Corte_Manga_R)],
      ["Ret. Abrir Molde", toNum(b.tiempos_Ret_Abrir_Molde_L), toNum(b.tiempos_Ret_Abrir_Molde_R)],
      ["Ret. Cerrar Molde", toNum(b.tiempos_Ret_Cerrar_Molde_L), toNum(b.tiempos_Ret_Cerrar_Molde_R)],
      ["Ret. Pre-Soplo", toNum(b.tiempos_Ret_Pre_Soplo_L), toNum(b.tiempos_Ret_Pre_Soplo_R)],
      ["Tiempo Pre-Soplo", toNum(b.tiempos_Tiempo_Pre_Soplo_L), toNum(b.tiempos_Tiempo_Pre_Soplo_R)],
      ["Ret. Soplo", toNum(b.tiempos_Ret_Soplo_L), toNum(b.tiempos_Ret_Soplo_R)],
      ["Tiempo Soplo", toNum(b.tiempos_Tiempo_Soplo_L), toNum(b.tiempos_Tiempo_Soplo_R)],
      ["Ret. Bajar Pico", toNum(b.tiempos_Ret_Bajar_Pico_L), toNum(b.tiempos_Ret_Bajar_Pico_R)],
      ["Tiemp Subir Pico 1", toNum(b.tiempos_Tiemp_Subir_Pico_1_L), toNum(b.tiempos_Tiemp_Subir_Pico_1_R)],
      ["Ret. Subir Pico 2", toNum(b.tiempos_Ret_Subir_Pico_2_L), toNum(b.tiempos_Ret_Subir_Pico_2_R)]

    base.calef = {
      zonas: [9,8,7,6,5,4,3,2,1].map(z => ({
        z,
        on: toBool(b[`calef_z${z}_on`]),

      turbinas: [toBool(b.calef_turbina_1), toBool(b.calef_turbina_2), toBool(b.calef_turbina_3)],
      extra: [

        { n: "Valor de temp. (renglón inferior)", v: numOrNull(b.calef_valor_temp_inferior), u: "°C" }
      ]
    };
    base.manga = {
      rpm: toNum(b.manga_rpm),
      a: toNum(b.manga_a),
      hz: toNum(b.manga_hz),
      perilla: toNum(b.manga_perilla),
      estado: String(b.manga_estado || '').trim(),

      ["F-EXHAUST", toNum(q.time1_F_EXHAUST)],
      ["PIN PRE-UP", toNum(q.time1_PIN_PRE_UP)],
      ["FLASH", toNum(q.time1_FLASH)],
      ["ROTATION TIME", toNum(q.time1_ROTATION_TIME)],
      ["Die blow", toNum(q.time1_Die_blow)]
    ];
    base.time2 = {
      izq: [
        ["Station up delay", toNum(q.time2_Station_up_delay_L), toNum(q.time2_Station_up_delay_R)],
        ["Mold close delay", toNum(q.time2_Mold_close_delay_L), toNum(q.time2_Mold_close_delay_R)],
        ["Cutter delay", toNum(q.time2_Cutter_delay_L), toNum(q.time2_Cutter_delay_R)],
        ["Station down delay", toNum(q.time2_Station_down_delay_L), toNum(q.time2_Station_down_delay_R)],
        ["Head lift delay", toNum(q.time2_Head_lift_delay_L), toNum(q.time2_Head_lift_delay_R)],
        ["Deflash delay", toNum(q.time2_Deflash_delay)]
      ],
      der: [
        ["Pin down delay", toNum(q.time2_Pin_down_delay_L), toNum(q.time2_Pin_down_delay_R)],
        ["Blow delay", toNum(q.time2_Blow_delay_L), toNum(q.time2_Blow_delay_R)],
        ["Mold open delay", toNum(q.time2_Mold_open_delay_L), toNum(q.time2_Mold_open_delay_R)],
        ["Pin up delay", toNum(q.time2_Pin_up_delay_L), toNum(q.time2_Pin_up_delay_R)],
        ["Sub-mold delay", toNum(q.time2_Sub_mold_delay_L), toNum(q.time2_Sub_mold_delay_R)],
        ["Station down hold delay", toNum(q.time2_Station_down_hold_delay_L), toNum(q.time2_Station_down_hold_delay_R)]
      ]
    };
    base.pq1 = {
      izq: [
        ["M. close fast", toNum(q.pq1_M_close_fast_L), toNum(q.pq1_M_close_fast_R)],
        ["M. close slow", toNum(q.pq1_M_close_slow_L), toNum(q.pq1_M_close_slow_R)],
        ["M. close clamp", toNum(q.pq1_M_close_clamp_L), toNum(q.pq1_M_close_clamp_R)],
        ["M. open", toNum(q.pq1_M_open_L), toNum(q.pq1_M_open_R)]
      ],
      der: [
        ["Pin down fast", toNum(q.pq1_Pin_down_fast_L), toNum(q.pq1_Pin_down_fast_R)],
        ["Pin down slow", toNum(q.pq1_Pin_down_slow_L), toNum(q.pq1_Pin_down_slow_R)],
        ["Pin up", toNum(q.pq1_Pin_up_L), toNum(q.pq1_Pin_up_R)],
        ["CAP CLOSE", toNum(q.pq1_CAP_CLOSE_L), toNum(q.pq1_CAP_CLOSE_R)],
        ["CAP OPEN", toNum(q.pq1_CAP_OPEN_L), toNum(q.pq1_CAP_OPEN_R)]
      ]
    };
    base.pq2 = [
      { t: "L · Station up", P: [toNum(q.pq2_L_Station_up_P1), toNum(q.pq2_L_Station_up_P2), toNum(q.pq2_L_Station_up_P3)], Q: [toNum(q.pq2_L_Station_up_Q1), toNum(q.pq2_L_Station_up_Q2), toNum(q.pq2_L_Station_up_Q3)] },
      { t: "R · Station up", P: [toNum(q.pq2_R_Station_up_P1), toNum(q.pq2_R_Station_up_P2), toNum(q.pq2_R_Station_up_P3)], Q: [toNum(q.pq2_R_Station_up_Q1), toNum(q.pq2_R_Station_up_Q2), toNum(q.pq2_R_Station_up_Q3)] },
      { t: "L · Station down", P: [toNum(q.pq2_L_Station_down_P1), toNum(q.pq2_L_Station_down_P2), toNum(q.pq2_L_Station_down_P3)], Q: [toNum(q.pq2_L_Station_down_Q1), toNum(q.pq2_L_Station_down_Q2), toNum(q.pq2_L_Station_down_Q3)] },
      { t: "R · Station down", P: [toNum(q.pq2_R_Station_down_P1), toNum(q.pq2_R_Station_down_P2), toNum(q.pq2_R_Station_down_P3)], Q: [toNum(q.pq2_R_Station_down_Q1), toNum(q.pq2_R_Station_down_Q2), toNum(q.pq2_R_Station_down_Q3)] }
    ];
    base.variador = {
      hz: toNum(q.variador_hz),
      a: toNum(q.variador_a),
      v: toNum(q.variador_v)
    };
    base.agujas = {
      L: { casquillo: strOrNull(q.agujas_L_casquillo), cuchilla: strOrNull(q.agujas_L_cuchilla), cuello: strOrNull(q.agujas_L_cuello) },
      R: { casquillo: strOrNull(q.agujas_R_casquillo), cuchilla: strOrNull(q.agujas_R_cuchilla), cuello: strOrNull(q.agujas_R_cuello) }

  }
  return base;
}

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => String(v).replace('.', ',');
const n1 = v => Number(v).toFixed(1).replace('.', ',');
const secs = (v, f) => (v * f.unidad.factor).toFixed(1).replace('.', ',');
const dateEs = d => d ? d.split('-').reverse().join('/') : '';
function stats(f){
  const porCiclo = f.moldes * f.cavidades;
  return { porCiclo, ciclosHora: Math.round(3600 / f.ciclo), teorico: Math.round(3600 / f.ciclo * porCiclo) };
}
function axisTicks(max){
  const steps = [12,10,8,6,5,4,3,2,1];
  const st = steps.find(s => max/s >= 4) || 1;
  const t = []; for(let v=0; v<=max+1e-9; v+=st) t.push(v);
  return t;
}
const moldesTxt = f => (f.moldes && f.cavidades) ? `${f.moldes} MOLDES × ${f.cavidades} ${f.cavidades===1?'CAVIDAD':'CAVIDADES'}` : 'MOLDES × CAVIDADES: POR ANOTAR';

/* ---------- QR ---------- */
function qrMatrix(text){
  for(let t=1; t<=20; t++){
    try{
      const q = new QRLIB.QRCode(t, QRLIB.ECL.Q); q.addData(text); q.make();
      return { n:q.getModuleCount(), get:(r,c)=>q.isDark(r,c) };
    }catch(e){}
  }
  return null;
}
function qrSvg(text){
  const m = qrMatrix(text); if(!m) return '';
  let d = '';
  for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.get(r,c)) d += `M${c},${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${m.n+4} ${m.n+4}" role="img" aria-label="Código QR de la ficha" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${m.n+4}" height="${m.n+4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

/* ---------- navegación ---------- */
let current = null;
function show(id){
  const f = FICHAS.find(x => x.id === id);
  current = f ? f.id : '';
  closeOverlay();
  if(f) renderFicha(f); else renderCatalog();
  window.scrollTo(0,0);
}
function go(id){
  show(id);
  try{ if(id){ location.hash = id; } else if(location.hash){ location.hash = ''; } }catch(e){}
}
function route(){
  const h = (location.hash||'').slice(1);
  const f = FICHAS.find(x => x.id === h);
  const key = f ? f.id : '';
  if(key !== current) show(key);
}
window.addEventListener('hashchange', route);

/* ---------- catálogo ---------- */
const filt = { maq:'', q:'' };
function renderCatalog(){
  const maqs = [...new Set(FICHAS.map(f=>f.maquina).filter(Boolean))].sort();
  $('#app').innerHTML = `
    <div class="page-h"><h1>Catálogo de recetas</h1><span class="count" id="count"></span></div>
    <p class="lead">Elige una máquina o busca por SKU o descripción. También puedes escanear el QR pegado en la máquina para abrir directo su ficha.</p>
    <div class="filters">
      <div class="field"><label for="f-maq">Máquina</label>
        <select id="f-maq"><option value="">Todas</option>${maqs.map(m=>`<option value="${esc(m)}"${m===filt.maq?' selected':''}>${esc(m)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-q">Buscar SKU o descripción</label>
        <input id="f-q" type="search" placeholder="500128 o cera" value="${esc(filt.q)}" autocomplete="off"></div>
      <button class="btn" id="f-clear" type="button">Limpiar</button>
    </div>
    <div class="cards" id="cards"></div>`;
  const draw = () => {
    const q = filt.q.trim().toLowerCase();
    const list = FICHAS.filter(f => (!filt.maq || f.maquina===filt.maq) && (!q || (f.sku+' '+f.desc+' '+f.maquina).toLowerCase().includes(q)));
    $('#count').textContent = list.length + (list.length===1 ? ' ficha' : ' fichas') + ' de ' + FICHAS.length;
    $('#cards').innerHTML = list.length ? list.map(f=>{
      const s = stats(f);
      return `<a class="card" href="#${f.id}" data-open="${f.id}">
        <div class="ph"><img src="${esc(f.foto)}" alt="Envase ${esc(f.desc)}"></div>
        <div class="body">
          <div class="sku">${esc(f.sku)}</div>
          <div class="desc">${esc(f.desc)}</div>
          <div class="chips"><span class="chip">${esc(f.maquina)}</span><span class="chip out">${f.moldes && f.cavidades ? f.moldes+' moldes × '+f.cavidades+' cav.' : 'moldes y cav. por anotar'}</span></div>
          <div class="mini"><span><b>${num(f.ciclo)}</b> s ciclo</span><span><b>${s.porCiclo||'—'}</b> env/ciclo</span><span><b>${f.pesoG?num(f.pesoG):'—'}</b> g</span></div>
        </div></a>`;
    }).join('') : `<div class="empty">Ninguna ficha coincide con el filtro. Prueba con otra máquina o borra la búsqueda.</div>`;
  };
  $('#cards').addEventListener('click', e=>{
    const a = e.target.closest('[data-open]');
    if(a){ e.preventDefault(); go(a.getAttribute('data-open')); }
  });
  $('#f-maq').addEventListener('change', e=>{ filt.maq = e.target.value; draw(); });
  $('#f-q').addEventListener('input', e=>{ filt.q = e.target.value; draw(); });
  $('#f-clear').addEventListener('click', ()=>{ filt.maq=''; filt.q=''; $('#f-maq').value=''; $('#f-q').value=''; draw(); });
  draw();
}

/* ---------- piezas de la ficha ---------- */
const prow = (n, l, r) => {
  const cls = v => 'v' + (v===0 ? ' zero' : '');
  return `<div class="prow"><div class="nm">${esc(n)}</div>` + (r===null
    ? `<div class="${cls(l)} one">${num(l)}</div>`
    : `<div class="${cls(l)}">${num(l)}</div><div class="${cls(r)}">${num(r)}</div>`) + `</div>`;
};
const ptab = rows => `<div class="ptab"><div class="phead"><span></span><span>L</span><span>R</span></div>${rows.map(r=>prow(r[0],r[1],r[2]===undefined?null:r[2])).join('')}</div>`;
const secH = (tag, title, sub) => `<div class="sec-h"><span class="tag">${esc(tag)}</span><h2>${esc(title)}</h2>${sub?`<span class="sub">${sub}</span>`:''}</div>`;
const tile = (l, v, u, pend) => v===null || v===undefined
  ? `<div class="vf pend"><div class="l">${l}</div><div class="n">${pend||'por anotar'}</div></div>`
  : `<div class="vf"><div class="l">${l}</div><div class="n${v===0?' zero':''}">${num(v)}<small> ${u}</small></div></div>`;
const tool = v => (v===null || v===undefined) ? `<div class="blank">por anotar</div>` : `<div class="blank filled">${num(v)}</div>`;
const axisHtml = (f, max) => `<div class="axis"><span></span><div class="ticks">${axisTicks(max).map(t=>`<span style="left:${t/max*100}%">${t} s</span>`).join('')}</div><span></span></div>`;
const gridLines = max => axisTicks(max).slice(1).map(t=>`<i class="gl" style="left:${t/max*100}%"></i>`).join('');

/* cuerpo de la ficha QCM */
function bodyQCM(f){
  const U = f.unidad, max = f.ciclo;
  const bars = f.time1.map(([n,v])=>{
    const w = Math.min(100, v*U.factor/max*100);
    return `<div class="brow${v===0?' zero':''}"><div class="lb">${esc(n)}</div>
      <div class="track" role="img" aria-label="${esc(n)}: ${secs(v,f)} segundos">${gridLines(max)}${v>0?`<div class="fill" style="width:max(4px,${w.toFixed(2)}%)"></div>`:''}</div>
      <div class="vl">${secs(v,f)} s<small>valor ${num(v)}</small></div></div>`;
  }).join('');
  const pq2 = f.pq2.map(b=>`<div class="pqb"><h3>${esc(b.t)}</h3><div class="pqg">
      <span></span><span class="h">1</span><span class="h">2</span><span class="h">3</span>
      <span class="r">P</span>${b.P.map(v=>`<span class="v${v===0?' zero':''}">${num(v)}</span>`).join('')}
      <span class="r">Q</span>${b.Q.map(v=>`<span class="v${v===0?' zero':''}">${num(v)}</span>`).join('')}
    </div></div>`).join('');
  const a = f.agujas;
  return `
    ${secH('PANTALLA TIME 1','Tiempos del ciclo','A escala del ciclo de '+num(f.ciclo)+' s')}
    ${axisHtml(f,max)}
    <div class="bars">${bars}</div>
    <p class="note"><span class="flag">UNIDAD POR CONFIRMAR</span>Se asume 1 unidad = ${num(U.factor)} s. Cada barra es la duración de un temporizador; no indica el orden de las etapas.</p>

    ${secH('PANTALLA TIME 2','Retardos','L = izquierda · R = derecha')}
    <div class="cols">${ptab(f.time2.izq)}${ptab(f.time2.der)}</div>

    ${secH('PANTALLAS PQ VALVE 1 Y 2','Presión y caudal','P = presión · Q = caudal')}
    <div class="cols">${ptab(f.pq1.izq)}${ptab(f.pq1.der)}</div>
    <div class="pq2">${pq2}</div>

    ${secH('VARIADOR','Lectura del variador','')}
    <div class="vfd">${tile('Frecuencia',f.variador.hz,'Hz')}${tile('Corriente',f.variador.a,'A')}${tile('Voltaje mostrado',f.variador.v,'V')}</div>

    ${secH('AGUJAS','Herramientas: casquillo, cuchilla y cuello','Para el cambio de formato')}
    <div class="tools">
      <span></span><span class="hh">Casquillo</span><span class="hh">Cuchilla</span><span class="hh">Altura cuello</span>
      <span class="mo">Molde L</span>${tool(a.L.casquillo)}${tool(a.L.cuchilla)}${tool(a.L.cuello)}

/* cuerpo de la ficha BEKUM */
const extraTile = e => (e.c!==undefined)
  ? `<div class="vf"><div class="l">${esc(e.n)}</div><div class="n">${n1(e.c)}<small> ${e.u} consigna</small></div><div class="za2">actual ${n1(e.a)} ${e.u}</div></div>`

function bodyBekum(f){
  const U = f.unidad, max = f.ciclo;
  const bars = f.tiempos.map(([n,l,r])=>{
    const wl = Math.min(100, l*U.factor/max*100), wr = Math.min(100, r*U.factor/max*100), df = l!==r;
    return `<div class="brow${(l===0&&r===0)?' zero':''}"><div class="lb">${esc(n)}</div>
      <div class="track two" role="img" aria-label="${esc(n)}: izquierda ${secs(l,f)} s, derecha ${secs(r,f)} s">${gridLines(max)}
        ${l>0?`<div class="fill l" style="width:max(4px,${wl.toFixed(2)}%)"></div>`:''}${r>0?`<div class="fill d" style="width:max(4px,${wr.toFixed(2)}%)"></div>`:''}</div>
      <div class="vl2"><span${df?' class="df"':''}><i>I</i>${n1(l)}</span><span${df?' class="df"':''}><i>D</i>${n1(r)}</span></div></div>`;
  }).join('');
  const zones = f.calef.zonas.map(z=>`<div class="zt ${z.on?'on':'off'}"><div class="zn">Zona ${z.z}</div>
      <span class="pill ${z.on?'ok':'bad'}">${z.on?'ON':'OFF'}</span>
      <div class="zc">${n1(z.consigna)}</div><div class="zl">CONSIGNA °C</div><div class="za">actual ${n1(z.actual)}</div></div>`).join('');
  const sw = (l, on) => `<div class="sw"><span class="l">${l}</span><span class="pill ${on?'ok':'bad'}">${on?'ON':'OFF'}</span></div>`;
  const m = f.manga, h = f.herramientas;
  const soploItem = f.tiempos.find(t=>t[0]==='Tiempo Soplo');
  const soploVal = soploItem ? n1(soploItem[1]) : '0,0';
  return `
    ${secH('PANTALLA AJUSTE DE TIEMPOS','Tiempos del ciclo','A escala del ciclo de '+num(f.ciclo)+' s')}
    ${axisHtml(f,max)}
    <div class="bars">${bars}</div>
    <div class="key"><span><b style="background:var(--yellow)"></b>IZQ (I)</span><span><b style="background:var(--steel)"></b>DER (D)</span><span><b style="background:var(--hi)"></b>valor distinto entre lados</span></div>
    <p class="note"><span class="flag">UNIDAD POR CONFIRMAR</span>La pantalla dice "Tiempo en Seg." pero los valores (por ejemplo ${soploVal}) no caben en un ciclo de ${num(f.ciclo)} s. Se asume 1 unidad = ${num(U.factor)} s. Cada barra es la duración de un ajuste; no indica el orden de las etapas.</p>
    <p class="note">Se registran los valores de ajuste (columnas azules). Las columnas de la derecha de cada lado cambian durante el ciclo y no se guardan. Encabezado de la pantalla: ${n1(f.encabezado[0])} (izq) y ${n1(f.encabezado[1])} (der), sin etiqueta.</p>

    ${secH('PANTALLA AJUSTE CALEFACCIÓN','Zonas de temperatura','Consigna en °C')}
    <div class="zones">${zones}</div>
    <div class="sws">${sw('Cuchilla',f.calef.cuchilla)}${f.calef.turbinas.map((t,i)=>sw('Turbina '+(i+1),t)).join('')}</div>
    <div class="vfd" style="margin-top:12px">${f.calef.extra.map(extraTile).join('')}</div>

    ${secH('MANGA','Variador WEG y perilla','')}
    <div class="vfd">${tile('Velocidad',m.rpm,'rpm')}${tile('Corriente',m.a,'A')}${tile('Frecuencia',m.hz,'Hz')}${tile('Perilla (R10K)',m.perilla,'%')}</div>
    <p class="note">Estado del variador: ${esc(m.estado)}. La perilla se lee a ojo en la foto (≈ ${m.perilla} %). Anotado a mano en el equipo: "${esc(m.nota)}".</p>

    ${secH('AGUJAS','Herramientas de aguja','Para el cambio de formato (mm)')}
    <div class="vfd">${tile('Casquillo',h.casquillo,'mm')}${tile('Cuchilla',h.cuchilla,'mm')}${tile('Altura del cuello',h.cuello,'mm')}</div>`;
}

function closeOverlay(){

  const im = b.querySelector('img'); if(im && im.dataset.u){ try{ URL.revokeObjectURL(im.dataset.u); }catch(e){} }
  b.innerHTML = '';
}
function showOverlay(blob, name){
  const u = URL.createObjectURL(blob);
  $('#ovbox').innerHTML = `<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Imagen de la ficha"><div class="ovin">
    <p>Mantén presionada la imagen para guardarla o compartirla por WhatsApp.</p>

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOverlay(); });

const loadImg = src => new Promise((ok,no)=>{
  const i = new Image();
  i.crossOrigin = 'anonymous';
  i.onload = () => ok(i);
  i.onerror = () => ok(null);
  i.src = src;
});
async function saveImage(f){
  const btn = $('#img'); btn.disabled = true;
  try{
    try{ await Promise.all(['700 40px "Barlow Condensed"','600 40px "Barlow Condensed"','600 30px "IBM Plex Mono"','500 20px "Barlow"'].map(s=>document.fonts.load(s))); }catch(e){}
    const img = await loadImg(f.foto);
    const blob = await new Promise(res=>{
      const probe = document.createElement('canvas').getContext('2d');
      const H = paint(probe, false, f, img);
      const cv = document.createElement('canvas'); cv.width = 1080; cv.height = H;
      paint(cv.getContext('2d'), true, f, img);
      cv.toBlob(res, 'image/png');
    });
    if(!blob) throw new Error('sin imagen');
    const name = 'ficha-' + f.sku.replace('.','-') + '-' + f.maquina + '.png';
    showOverlay(blob, name);
  }catch(e){
    toast('No se pudo generar la imagen. Inténtalo otra vez');
  }finally{ btn.disabled = false; }
}

function paint(ctx, draw, f, img){
  const W = 1080, M = 40, IW = W - 2*M;
  const C = {bg:'#FFFFFF', ink:'#14181B', steel:'#58646E', line:'#C3CAD0', pan2:'#EEF0F2', yel:'#FFC400', dark:'#101316', fg:'#F2F4F5', mute:'#9AA6B0', hi:'#FFE08A', ok:'#1B7F3B', bad:'#C62828'};
  const FD='"Barlow Condensed","Arial Narrow",Arial,sans-serif', FM='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace', FB='"Barlow",system-ui,Arial,sans-serif';
  const s = stats(f), U = f.unidad;
  const R = (x,y,w,h,c)=>{ if(draw){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); } };
  const B = (x,y,w,h,c,lw=2,dash)=>{ if(draw){ ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash); ctx.strokeRect(x+lw/2,y+lw/2,w-lw,h-lw); ctx.restore(); } };
  const T = (t,x,y,font,c,al='left')=>{ if(draw){ ctx.font=font; ctx.fillStyle=c; ctx.textAlign=al; ctx.textBaseline='alphabetic'; ctx.fillText(t,x,y); } };
  const tw = (t,font)=>{ ctx.font=font; return ctx.measureText(t).width; };
  const fit = (t,maxW,wt,sz,fam)=>{ let q=sz; while(q>11 && tw(t,wt+' '+q+'px '+fam)>maxW) q--; return wt+' '+q+'px '+fam; };
  const stripe = y => { R(0,y,W,16,C.yel); if(draw){ ctx.fillStyle='#14181B'; for(let x=-16;x<W+16;x+=32){ ctx.beginPath(); ctx.moveTo(x,y+16); ctx.lineTo(x+16,y); ctx.lineTo(x+32,y); ctx.lineTo(x+16,y+16); ctx.closePath(); ctx.fill(); } } };
  const pill = (x,y,w,on)=>{ R(x,y,w,24,on?C.ok:C.bad); T(on?'ON':'OFF', x+w/2, y+18, '600 16px '+FM, '#fff', 'center'); };
  if(draw){ ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,10000); }
  let y = 0;
  stripe(y); y += 16;

  R(0,y,W,250,C.dark);
  R(M,y+20,120,210,'#fff');
  if(draw && img){ const r = Math.min(104/img.width, 194/img.height); const iw=img.width*r, ih=img.height*r; ctx.drawImage(img, M+60-iw/2, y+125-ih/2, iw, ih); }
  const tx = M+120+28;
  T('FICHA DE PROCESO · SOPLADO PEAD', tx, y+48, '500 17px '+FB, C.mute);
  T(f.sku, tx, y+112, '600 56px '+FM, C.yel);
  let fs = 38; const dtxt = f.desc.toUpperCase(); while(fs>20 && tw(dtxt,'700 '+fs+'px '+FD) > (W-M-250-30-tx)) fs-=2;
  T(dtxt, tx, y+160, '700 '+fs+'px '+FD, C.fg);
  const mt = 'MÁQUINA ' + f.maquina; const mw = tw(mt,'600 18px '+FM)+24;
  R(tx,y+184,mw,34,C.yel); T(mt, tx+12, y+208, '600 18px '+FM, C.ink);
  const ct = moldesTxt(f); const cfont = fit(ct, W-M-250-30-(tx+mw+12)-24, '600', 16, FM); const cw = tw(ct,cfont)+24;
  B(tx+mw+12,y+184,cw,34,C.mute,2); T(ct, tx+mw+24, y+207, cfont, C.fg);
  const lx = W-M-230;
  R(lx,y+20,230,210,'#07090A'); B(lx,y+20,230,210,'#2A3238',3);
  T((f.cicloTipo||'Ciclo real').toUpperCase(), lx+115, y+54, '600 18px '+FD, C.mute, 'center');
  T(String(f.ciclo).replace('.',','), lx+115, y+158, '600 108px '+FM, C.yel, 'center');
  T('segundos', lx+115, y+198, '500 18px '+FM, C.mute, 'center');
  y += 250 + 22;

  const tiles = [
    [String(s.porCiclo),'ENVASES POR CICLO', s.porCiclo ? f.moldes+' moldes × '+f.cavidades+' cav.' : 'falta anotar moldes y cav.', !s.porCiclo],
    [String(s.ciclosHora),'CICLOS POR HORA','3600 s ÷ '+f.ciclo+' s', false],
    [String(s.teorico),'ENVASES/H TEÓRICO', s.teorico ? 'sin paros ni rechazos' : 'depende de moldes y cav.', !s.teorico],
    [String(f.bolsas),'BOLSAS ESTÁNDAR', f.bolsasPeriodo||'período por confirmar', false],
    [num(f.pesoG)+' g','PESO DEL ENVASE', f.pesoG&&s.porCiclo ? num(f.pesoG*s.porCiclo)+' g por ciclo' : 'falta anotar el peso', !f.pesoG]];
  const tg = 10, tl = (IW - 4*tg)/5;
  tiles.forEach((t,i)=>{ const x=M+i*(tl+tg), mw2=tl-28; B(x,y,tl,112,C.line,2); T(t[0],x+14,y+48,fit(t[0],mw2,'600',42,FM),t[3]?C.steel:C.ink); T(t[1],x+14,y+76,fit(t[1],mw2,'700',19,FD),C.ink); T(t[2],x+14,y+98,fit(t[2],mw2,'400',15,FB),C.steel); });
  y += 112 + 8;

  const sec = (tag,title,sub)=>{ y += 22; R(M,y,IW,42,C.dark); const w=tw(tag,'600 16px '+FM)+20; R(M+10,y+9,w,24,C.yel); T(tag,M+20,y+27,'600 16px '+FM,C.ink); T(title.toUpperCase(),M+10+w+14,y+30,'700 25px '+FD,C.fg); if(sub) T(sub,M+IW-12,y+27,'400 16px '+FB,C.mute,'right'); y += 42 + 14; };
  const colW = (IW-30)/2;
  const table = (x, y0, rows)=>{
    let yy = y0;
    T('L', x+colW-92, yy+14, '700 17px '+FD, C.steel, 'center'); T('R', x+colW-30, yy+14, '700 17px '+FD, C.steel, 'center'); yy += 22;
    rows.forEach(r=>{
      R(x,yy+33,colW,1,C.line); T(r[0], x, yy+23, '500 21px '+FB, C.ink);
      const one = r[2]===undefined || r[2]===null;
      const put = (v,cx)=>{ R(cx-27,yy+3,54,28,C.pan2); T(num(v), cx, yy+25, (v===0?'500':'600')+' 20px '+FM, v===0?C.steel:C.ink, 'center'); };
      if(one){ R(x+colW-122,yy+3,92,28,C.pan2); T(num(r[1]), x+colW-76, yy+25, '600 20px '+FM, r[1]===0?C.steel:C.ink, 'center'); }
      else { put(r[1], x+colW-92); put(r[2], x+colW-30); }
      yy += 34;
    });
    return yy;
  };
  const two = (a,b)=>{ const y1 = table(M,y,a), y2 = table(M+colW+30,y,b); y = Math.max(y1,y2); };
  const box = (x,yy,w,h,label,val,unit,pend,pendTxt)=>{
    if(val===null||val===undefined){ B(x,yy,w,h,C.steel,2,[8,6]); T(label.toUpperCase(),x+14,yy+28,fit(label.toUpperCase(),w-28,'700',17,FD),C.steel); T(pendTxt||'por anotar',x+14,yy+h-18,'400 17px '+FM,C.steel); }
    else { B(x,yy,w,h,C.ink,1); T(label.toUpperCase(),x+14,yy+28,fit(label.toUpperCase(),w-28,'700',17,FD),C.steel); const t=num(val)+' '+unit; T(t,x+14,yy+h-18,fit(t,w-28,(val===0?'500':'600'),34,FM),val===0?C.steel:C.ink); }
  };
  const axisCv = (bx,bw,max)=>{ axisTicks(max).forEach((t,i)=>T(t+' s', bx+bw*t/max, y+12, '500 15px '+FM, C.steel, i===0?'left':'center')); y += 20; };
  const gridCv = (bx,bw,max,yy,h)=>{ axisTicks(max).slice(1).forEach(t=>R(bx+bw*t/max,yy,1,h,C.line)); };

  if(f.layout==='bekum'){
    sec('PANTALLA AJUSTE DE TIEMPOS','Tiempos del ciclo','A escala del ciclo de '+f.ciclo+' s');
    const lbW=250, vlW=130, bx=M+lbW+10, bw=IW-lbW-vlW-20, max=f.ciclo;
    axisCv(bx,bw,max);
    f.tiempos.forEach(([n,l,r])=>{
      const rh = 44, df = l!==r;
      R(bx,y+3,bw,36,C.pan2); gridCv(bx,bw,max,y+3,36);
      const wl = Math.min(bw, l*U.factor/max*bw), wr = Math.min(bw, r*U.factor/max*bw);
      if(l>0){ R(bx,y+6,Math.max(4,wl),14,C.yel); R(bx+Math.max(4,wl)-3,y+6,3,14,C.ink); }
      if(r>0){ R(bx,y+22,Math.max(4,wr),14,C.steel); R(bx+Math.max(4,wr)-3,y+22,3,14,C.ink); }
      const zero = l===0&&r===0;
      T(n.toUpperCase(), M, y+28, fit(n.toUpperCase(),lbW-6,'600',23,FD), zero?C.steel:C.ink);
      if(df) R(M+IW-vlW+30,y+4,vlW-30,34,C.hi);
      T('I', M+IW-vlW+40, y+19, '500 15px '+FM, C.steel); T(n1(l), M+IW-4, y+19, '600 17px '+FM, C.ink, 'right');
      T('D', M+IW-vlW+40, y+35, '500 15px '+FM, C.steel); T(n1(r), M+IW-4, y+35, '600 17px '+FM, C.ink, 'right');
      y += rh;
    });
    y += 6;
    R(bx,y,14,10,C.yel); T('IZQ (I)', bx+22, y+10, '400 15px '+FB, C.steel);
    R(bx+110,y,14,10,C.steel); T('DER (D)', bx+132, y+10, '400 15px '+FB, C.steel);
    R(bx+230,y,14,10,C.hi); T('valor distinto entre lados', bx+252, y+10, '400 15px '+FB, C.steel);
    y += 24;
    T('UNIDAD POR CONFIRMAR: se asume 1 unidad = '+num(U.factor)+' s (la pantalla dice "Tiempo en Seg." pero los valores no caben en el ciclo).', M, y+12, '400 15px '+FB, C.steel); y += 20;
    T('Se registran los valores de ajuste. Las columnas en vivo de la pantalla no se guardan. Encabezado: '+n1(f.encabezado[0])+' izq · '+n1(f.encabezado[1])+' der, sin etiqueta.', M, y+12, '400 15px '+FB, C.steel); y += 22;

    sec('PANTALLA AJUSTE CALEFACCIÓN','Zonas de temperatura','Consigna en °C');
    const zg = 8, zw = (IW-8*zg)/9;
    f.calef.zonas.forEach((z,i)=>{
      const x = M+i*(zw+zg);
      B(x,y,zw,128,C.ink,1); if(!z.on) R(x+1,y+1,zw-2,126,C.pan2);
      T('ZONA '+z.z, x+zw/2, y+24, '700 19px '+FD, C.ink, 'center');
      pill(x+(zw-64)/2, y+34, 64, z.on);
      T(n1(z.consigna), x+zw/2, y+82, (z.on?'600':'500')+' 24px '+FM, z.on?C.ink:C.steel, 'center');
      T('CONSIGNA °C', x+zw/2, y+98, '600 12px '+FD, C.steel, 'center');
      T('actual '+n1(z.actual), x+zw/2, y+117, '400 13px '+FM, C.steel, 'center');
    });
    y += 128 + 12;
    const swn = 4, swg = 10, sww = (IW-(swn-1)*swg)/swn;
    [['CUCHILLA',f.calef.cuchilla]].concat(f.calef.turbinas.map((t,i)=>['TURBINA '+(i+1),t])).forEach(([l,on],i)=>{
      const x = M+i*(sww+swg); B(x,y,sww,48,C.ink,1); T(l,x+12,y+31,'700 19px '+FD,C.ink); pill(x+sww-12-64,y+12,64,on);
    });
    y += 48 + 12;
    const hw = (IW-12)/2;
    f.calef.extra.forEach((e,i)=>{
      const x = M+i*(hw+12);
      if(e.c!==undefined){
        const big = n1(e.c)+' '+e.u;
        B(x,y,hw,70,C.ink,1); T(e.n.toUpperCase(),x+14,y+28,fit(e.n.toUpperCase(),hw-28,'700',17,FD),C.steel);
        T(big,x+14,y+58,'600 30px '+FM,C.ink); T('consigna',x+24+tw(big,'600 30px '+FM),y+58,'400 15px '+FB,C.steel);
        T('actual '+n1(e.a)+' '+e.u,x+hw-14,y+58,'500 18px '+FM,C.steel,'right');
      } else box(x,y,hw,70,e.n,e.v,e.u,true,'ilegible en la foto');
    });
    y += 70;

    sec('MANGA','Variador WEG y perilla','');
    const mw4 = (IW-3*10)/4, m = f.manga;
    [['Velocidad',m.rpm,'rpm'],['Corriente',m.a,'A'],['Frecuencia',m.hz,'Hz'],['Perilla (R10K)',m.perilla,'%']].forEach((t,i)=>box(M+i*(mw4+10), y, mw4, 86, t[0], t[1], t[2]));
    y += 86 + 8;
    T('Estado: '+m.estado+' · perilla leída a ojo (≈ '+m.perilla+' %) · anotado a mano en el equipo: "'+m.nota+'"', M, y+14, '400 15px '+FB, C.steel); y += 24;

    sec('AGUJAS','Herramientas de aguja','Para el cambio de formato (mm)');
    const h = f.herramientas, hw3 = (IW-2*12)/3;
    [['Casquillo',h.casquillo],['Cuchilla',h.cuchilla],['Altura del cuello',h.cuello]].forEach((t,i)=>box(M+i*(hw3+12), y, hw3, 86, t[0], t[1], 'mm'));
    y += 86;
  } else {
    sec('PANTALLA TIME 1','Tiempos del ciclo','A escala del ciclo de '+f.ciclo+' s');
    const lbW=190, vlW=170, bx=M+lbW+10, bw=IW-lbW-vlW-20, max=f.ciclo;
    axisCv(bx,bw,max);
    f.time1.forEach(([n,v])=>{
      const sc = v*U.factor, w = Math.min(bw, sc/max*bw), rh = 40;
      R(bx,y+4,bw,28,C.pan2); gridCv(bx,bw,max,y+4,28);
      if(v>0){ R(bx,y+4,Math.max(4,w),28,C.yel); R(bx+Math.max(4,w)-3,y+4,3,28,C.ink); }
      T(n.toUpperCase(), M, y+25, '600 22px '+FD, v===0?C.steel:C.ink);
      T(secs(v,f)+' s', M+IW, y+18, '600 20px '+FM, v===0?C.steel:C.ink, 'right');
      T('valor '+num(v), M+IW, y+34, '500 13px '+FM, C.steel, 'right');
      y += rh;
    });
    y += 4;
    T('UNIDAD POR CONFIRMAR: se asume 1 unidad = '+num(U.factor)+' s. Cada barra es la duración de un temporizador, no el orden de las etapas.', M, y+14, '400 15px '+FB, C.steel);
    y += 14;
    sec('PANTALLA TIME 2','Retardos','L = izquierda · R = derecha');
    two(f.time2.izq, f.time2.der);
    sec('PANTALLAS PQ VALVE 1 Y 2','Presión y caudal','P = presión · Q = caudal');
    two(f.pq1.izq, f.pq1.der);
    y += 16;
    const bh = 30+24+2*34+10;
    f.pq2.forEach((b,i)=>{
      const x = M + (i%2)*(colW+30), yy = y + Math.floor(i/2)*(bh+14);
      B(x,yy,colW,bh,C.ink,1);
      T(b.t.toUpperCase(), x+12, yy+22, '600 15px '+FM, C.ink);
      [1,2,3].forEach(k=>T(String(k), x+110+(k-1)*110+35, yy+46, '500 14px '+FM, C.steel, 'center'));
      [['P',b.P],['Q',b.Q]].forEach(([l,vals],ri)=>{
        const ry = yy+54+ri*34; T(l, x+14, ry+23, '700 19px '+FD, C.steel);
        vals.forEach((v,k)=>{ const cx = x+110+k*110+35; R(cx-35,ry+3,70,28,C.pan2); T(num(v), cx, ry+25, (v===0?'500':'600')+' 21px '+FM, v===0?C.steel:C.ink, 'center'); });
      });
    });
    y += 2*(bh+14) - 14;
    sec('VARIADOR','Lectura del variador','');
    const vw = (IW-2*12)/3;
    [['Frecuencia',f.variador.hz,'Hz'],['Corriente',f.variador.a,'A'],['Voltaje mostrado',f.variador.v,'V']].forEach((t,i)=>box(M+i*(vw+12), y, vw, 86, t[0], t[1], t[2]));
    y += 86;
    sec('AGUJAS','Herramientas: casquillo, cuchilla y cuello','Para el cambio de formato');
    const cwid = 230, c0 = M+120;
    ['CASQUILLO','CUCHILLA','ALTURA CUELLO'].forEach((l,k)=>T(l, c0+k*(cwid+12)+cwid/2, y+14, '700 17px '+FD, C.steel, 'center')); y += 22;
    [['Molde L',f.agujas.L],['Molde R',f.agujas.R]].forEach(([n,a])=>{
      T(n, M, y+32, '600 20px '+FM, C.ink);
      [a.casquillo,a.cuchilla,a.cuello].forEach((v,k)=>{ const x=c0+k*(cwid+12); if(v!==null&&v!==undefined){ B(x,y,cwid,46,C.ink,2); T(num(v),x+cwid/2,y+32,'600 22px '+FM,C.ink,'center'); } else { B(x,y,cwid,46,C.steel,2,[8,6]); T('por anotar',x+cwid/2,y+29,'400 16px '+FM,C.steel,'center'); } });
      y += 56;
    });
    y += 4;
  }
  y += 10;
  (f.leyenda||[]).forEach(t=>{ T(t, M, y+14, '400 15px '+FB, C.steel); y += 22; });
  y += 12;

  R(M,y,IW,2,C.ink); y += 22;
  const qs = 220, m = qrMatrix(fichaUrl(f));
  B(M,y,qs,qs,C.ink,2);
  if(draw && m){ const cell = Math.floor((qs-24)/m.n), off = M+(qs-cell*m.n)/2, oy = y+(qs-cell*m.n)/2; ctx.fillStyle='#000'; for(let r=0;r<m.n;r++) for(let c=0;c<m.n;c++) if(m.get(r,c)) ctx.fillRect(off+c*cell, oy+r*cell, cell, cell); }
  const fx = M+qs+30;
  T('ESCANEA PARA ABRIR ESTA FICHA', fx, y+44, '700 36px '+FD, C.ink);
  const u = fichaUrl(f); const per = Math.floor((W-M-fx)/9.6); let ly = y+86;
  for(let i=0;i<u.length;i+=per){ T(u.slice(i,i+per), fx, ly, '500 16px '+FM, C.ink); ly += 22; }
  T('Ficha '+f.version+' · '+dateEs(f.fecha)+' · '+f.maquina+' · SKU '+f.sku, fx, Math.max(ly+16, y+qs-8), '400 17px '+FB, C.steel);
  y += qs + 28;
  stripe(y); y += 16;
  return y;
}

/* ---------- arranque con carga desde Google Sheets ---------- */
async function init(){
  try {
    const [recetas, qcmRows, bekumRows] = await Promise.all([
      fetchCsv(URL_RECETAS),
      fetchCsv(URL_QCM),
      fetchCsv(URL_BEKUM)
    ]);
    const qMap = new Map(qcmRows.filter(r => r.id).map(r => [String(r.id).trim(), r]));
    const bMap = new Map(bekumRows.filter(r => r.id).map(r => [String(r.id).trim(), r]));
    FICHAS = recetas
      .filter(r => r.id && String(r.id).trim() !== '')
      .map(r => buildFicha(r, qMap, bMap));
    route();
  } catch (err) {
    $('#app').innerHTML = `<div class="empty">No se pudieron cargar las recetas desde Google Sheets. Verifica tu conexión a internet o que las 3 pestañas estén publicadas en la web.</div>`;
  }
}
init();
</script>
